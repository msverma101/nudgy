[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nudgy"
dynamic = ["version"]
description = "A tiny desktop pet that keeps what needs you in one always-on-top list"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# No pip dependencies: GTK, cairo and the tray icon come from the system (python3-gi, python3-gi-cairo,
# gir1.2-gtk-3.0), so install with access to system packages: pipx install --system-site-packages .
dependencies = []
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.scripts]
nudgy = "nudgy.__main__:main"

[project.urls]
Homepage = "https://github.com/msverma101/nudgy"

[tool.setuptools]
packages = ["nudgy", "nudgy.core", "nudgy.sources"]

[tool.setuptools.dynamic]
version = { attr = "nudgy.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear (likely bugs), and pyupgrade for 3.10 syntax
select = ["F", "E", "W", "B", "UP"]
ignore = ["E402"]   # gi.require_version must run before the GTK imports

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true      # gi, cairo and the speech libraries have no type stubs
check_untyped_defs = true
warn_unused_ignores = true
# GTK callbacks use "lambda: action() and False" (run once, then stop); mypy flags any function that
# returns nothing being used in an expression, which is exactly that idiom.
disable_error_code = ["func-returns-value"]
