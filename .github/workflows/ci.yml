name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0
      - run: /usr/bin/python3 -m unittest discover -s tests -t .
      - run: sh -n install.sh && sh -n uninstall.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: bridges/whatsapp
        run: npm ci --omit=dev --ignore-scripts --no-fund --no-audit && npm audit --omit=dev && node --test test.mjs

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      # Exact versions, so a new release of a checker can't fail the build on its own.
      - run: uvx ruff@0.17.5 check nudgy tests tools
      - run: uvx mypy@2.4.1 nudgy

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
