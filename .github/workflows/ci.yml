name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0
      - run: /usr/bin/python3 -m unittest discover -s tests -t .
      - run: sh -n install.sh && sh -n uninstall.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: bridges/whatsapp
        run: npm ci --omit=dev --ignore-scripts --no-fund --no-audit && npm audit --omit=dev && node --test test.mjs
